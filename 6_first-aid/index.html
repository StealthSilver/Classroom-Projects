<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI First Aid Kit Doctor Assistant</title>
    <style>
      :root {
        --bg: #f3f7f9;
        --card: #ffffff;
        --ink: #14232b;
        --dim: #5b6f79;
        --line: #d3dfe5;
        --red: #c4161c;
        --redbg: #fdecec;
        --teal: #0f6b6e;
        --tealbg: #e3f2f2;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.55 system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
      }
      .sos {
        background: var(--red);
        color: #fff;
        text-align: center;
        padding: 9px 12px;
        font-weight: 600;
        font-size: 15px;
      }
      main {
        max-width: 740px;
        margin: 0 auto;
        min-height: calc(100% - 40px);
        display: flex;
        flex-direction: column;
        padding: 18px 16px 14px;
      }
      h1 {
        margin: 0 0 2px;
        font-size: 26px;
        line-height: 1.2;
        letter-spacing: -0.01em;
      }
      .sub {
        margin: 0 0 14px;
        color: var(--dim);
      }
      .language {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        color: var(--dim);
        font-size: 14px;
      }
      .language select {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--ink);
        padding: 6px 10px;
        font: inherit;
      }
      #chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 14px;
        overflow-y: auto;
        padding: 2px 2px 12px;
      }
      .msg {
        max-width: 92%;
        padding: 12px 15px;
        border-radius: 12px;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--teal);
        color: #fff;
      }
      .msg.bot {
        align-self: flex-start;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .msg h2 {
        margin: 0 0 6px;
        font-size: 17px;
        color: var(--teal);
      }
      .msg p {
        margin: 0 0 8px;
      }
      .msg ol {
        margin: 0 0 10px;
        padding-left: 22px;
      }
      .msg li {
        margin-bottom: 5px;
      }
      .alert {
        background: var(--redbg);
        border-left: 5px solid var(--red);
        color: #7d0b10;
        font-weight: 600;
        padding: 9px 12px;
        margin: 0 0 10px;
        border-radius: 4px;
      }
      .warn {
        background: var(--tealbg);
        border-left: 5px solid var(--teal);
        padding: 9px 12px;
        margin: 0 0 4px;
        border-radius: 4px;
      }
      .trace {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px dashed var(--line);
        font-size: 13px;
        color: var(--dim);
      }
      .trace b {
        color: var(--ink);
        font-weight: 600;
      }
      .bar {
        display: inline-block;
        vertical-align: middle;
        width: 80px;
        height: 6px;
        background: var(--line);
        border-radius: 3px;
        margin: 0 6px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--teal);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin: 0 0 12px;
      }
      .chips button {
        background: var(--card);
        color: var(--teal);
        border: 1px solid var(--teal);
        border-radius: 999px;
        padding: 5px 12px;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
      }
      .chips button:hover {
        background: var(--tealbg);
      }
      form {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      #text {
        flex: 1;
        min-width: 0;
        background: var(--card);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        font: inherit;
      }
      button {
        font: inherit;
      }
      #mic {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid var(--red);
        background: var(--card);
        color: var(--red);
        font-size: 20px;
        cursor: pointer;
        flex: none;
      }
      #mic.on {
        background: var(--red);
        color: #fff;
        animation: pulse 1.2s infinite;
      }
      #send {
        background: var(--teal);
        color: #fff;
        border: 0;
        border-radius: 10px;
        padding: 12px 18px;
        font-weight: 600;
        cursor: pointer;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 8px rgba(196, 22, 28, 0.2);
        }
      }
      .foot {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-top: 10px;
        font-size: 14px;
        color: var(--dim);
      }
      .foot label {
        cursor: pointer;
      }
      #status {
        min-height: 1.4em;
      }
      .note {
        margin: 8px 0 0;
        font-size: 12.5px;
        color: var(--dim);
      }
      :focus-visible {
        outline: 3px solid #1b6fd6;
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        #mic.on {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="sos" id="sos">
      In an emergency call 112 (India) or your local emergency number first.
    </div>
    <main>
      <div class="language">
        <label for="language" id="languageLabel">Language</label>
        <select id="language" aria-label="Language">
          <option value="en">English</option>
          <option value="hi">हिन्दी</option>
        </select>
      </div>
      <h1 id="heading">First Aid Assistant</h1>
      <p class="sub" id="subtitle">
        Describe what happened by voice or text and get simple first aid steps.
      </p>

      <div id="chat" aria-live="polite"></div>
      <div class="chips" id="chips"></div>

      <form id="form" autocomplete="off">
        <button
          type="button"
          id="mic"
          aria-label="Start or stop listening"
          title="Click and speak"
        >
          &#127908;
        </button>
        <input
          id="text"
          type="text"
          placeholder="Example: my friend has a burn on his hand"
          aria-label="Describe the situation"
        />
        <button id="send" type="submit">Ask</button>
      </form>

      <div class="foot">
        <span id="status"></span>
        <label
          ><input type="checkbox" id="speakToggle" checked /> <span id="speakLabel">Speak answers</span></label
        >
      </div>
      <p class="note" id="note">
        Learning project, not a doctor. These are basic first aid steps and do
        not replace professional medical care.
      </p>
    </main>

            "I am sorry you are going through this. Please reach out right now: call 112 if you are in immediate danger, or call Tele-MANAS at 14416 (India) to talk to a trained counsellor. If you can, stay with someone you trust.",
          greeting:
            "Hello! Tell me what happened, for example “someone has a burn” or “nosebleed”.",
          thanks: "You are welcome. Stay safe!",
          goodbye: "Goodbye! Keep a first aid kit at home and learn CPR.",
          help: "I can guide you on: ",
          fallback: "none",
          chips: [
            "How to treat a burn?",
            "Someone is choking",
            "I have a nosebleed",
            "My friend got a snake bite",
          ],
          welcome:
            "Hello, I am your first aid assistant. Press the mic or type what happened, for example “my friend has a burn on his hand”.",
        },
        hi: {
          title: "AI प्राथमिक उपचार सहायक",
          sos: "आपातस्थिति में पहले 112 (भारत) या अपने स्थानीय आपातकालीन नंबर पर कॉल करें।",
          language: "भाषा",
          heading: "प्राथमिक उपचार सहायक",
          subtitle:
            "क्या हुआ, आवाज़ से या लिखकर बताएँ और प्राथमिक उपचार के आसान निर्देश पाएँ।",
          mic: "सुनना शुरू या बंद करें",
          micTitle: "बोलने के लिए क्लिक करें",
          placeholder: "उदाहरण: मेरे दोस्त के हाथ में जलन हो गई है",
          describe: "स्थिति बताएँ",
          ask: "पूछें",
          speak: "जवाब बोलकर सुनाएँ",
          note:
            "यह सीखने के लिए बनाया गया प्रोजेक्ट है, डॉक्टर नहीं। ये प्राथमिक उपचार के बुनियादी निर्देश हैं और पेशेवर चिकित्सा देखभाल का विकल्प नहीं हैं।",
          listening: "सुन रहा है...",
          micBlocked:
            "माइक्रोफ़ोन बंद है। ब्राउज़र के एड्रेस बार में माइक्रोफ़ोन की अनुमति दें।",
          noSpeech: "कुछ सुनाई नहीं दिया। माइक्रोफ़ोन पर क्लिक करके फिर कोशिश करें।",
          noMicrophone: "माइक्रोफ़ोन नहीं मिला।",
          speechNetwork: "आवाज़ पहचानने के लिए इंटरनेट कनेक्शन ज़रूरी है।",
          micError: "माइक्रोफ़ोन त्रुटि: ",
          browserVoice: "आवाज़ से लिखने के लिए Chrome या Edge चाहिए। आप लिखकर पूछ सकते हैं।",
          micStartError: "माइक्रोफ़ोन शुरू नहीं हो सका।",
          cleanedWords: "साफ़ किए गए शब्द:",
          bestMatch: "सबसे अच्छा मिलान:",
          similarity: "समानता:",
          step: "चरण",
          emergency:
            "यह आपातस्थिति हो सकती है। अभी 112 (भारत) या अपने स्थानीय आपातकालीन नंबर पर कॉल करें।",
          noMatch:
            "माफ़ करें, इसके लिए मेरे पास प्राथमिक उपचार के निर्देश नहीं हैं। अलग तरह से बताएँ, जैसे “जलना”, “कटना”, “दम घुटना” या “बुखार”। स्थिति गंभीर हो तो अभी 112 पर कॉल करें।",
          selfHarmTitle: "आप अकेले नहीं हैं।",
          selfHarm:
            "मुझे दुख है कि आप इस मुश्किल से गुज़र रहे हैं। कृपया अभी किसी से संपर्क करें: तत्काल खतरा हो तो 112 पर कॉल करें, या प्रशिक्षित परामर्शदाता से बात करने के लिए टेली-मानस 14416 (भारत) पर कॉल करें। हो सके तो किसी भरोसेमंद व्यक्ति के साथ रहें।",
          greeting:
            "नमस्ते! बताएँ क्या हुआ, उदाहरण के लिए “किसी को जल गया है” या “नाक से खून आ रहा है”।",
          thanks: "आपका स्वागत है। सुरक्षित रहें!",
          goodbye: "अलविदा! घर पर प्राथमिक उपचार किट रखें और CPR सीखें।",
          help: "मैं इन विषयों पर मार्गदर्शन दे सकता हूँ: ",
          fallback: "कोई नहीं",
          chips: [
            "जलने पर क्या करें?",
            "किसी का दम घुट रहा है",
            "मेरी नाक से खून आ रहा है",
            "मेरे दोस्त को साँप ने काट लिया",
          ],
          welcome:
            "नमस्ते, मैं आपका प्राथमिक उपचार सहायक हूँ। माइक्रोफ़ोन दबाएँ या क्या हुआ लिखें, उदाहरण के लिए “मेरे दोस्त के हाथ में जलन हो गई है”।",
        },
      };

      let language = "en";
      const copy = () => COPY[language];

      /* ============================================================
   2. NLP PIPELINE: lowercase -> tokenize -> stopwords -> lemmatize
   ============================================================ */
      const STOP = new Set(
        (
          "a an the is are was were be been am do does did of in on at to for with and or but if it its " +
          "this that these those what which who whom how why when where can could would should will shall me my you your " +
          "tell explain describe define about please give mean meaning i we us they them there then than so as by from into " +
          "between know someone somebody he she his her got get have has had just person happen happened happens very some " +
          "now need want मुझे मेरा मेरी मैं तुम आप क्या कैसे कब कहाँ कौन क्यों और है हैं था थी थे यह वह को का की के से में पर नहीं करें बताएं कोई"
        ).split(" "),
      );

      function tokenize(text) {
        return text.toLowerCase().match(/[a-z0-9\u0900-\u097f]+/g) || [];
      }

      function lemma(w) {
        if (w.length > 4 && w.endsWith("ies")) return w.slice(0, -3) + "y";
        if (w.length > 4 && /(ses|xes|ches|shes)$/.test(w))
          return w.slice(0, -2);
        if (w.length > 3 && w.endsWith("s") && !/(ss|us|is)$/.test(w))
          return w.slice(0, -1);
        return w;
      }

      function preprocess(text) {
        return tokenize(text)
          .filter((w) => !STOP.has(w))
          .map(lemma);
      }

      /* ============================================================
   3. TF-IDF + COSINE SIMILARITY
   ============================================================ */
      const docs = KB.map((k) => {
        const hindi = HI_KB[k.title];
        return preprocess(
          [k.title, k.q, k.tags, hindi.title, hindi.q, hindi.tags].join(" "),
        );
      });
      const N = docs.length;
      const df = new Map();
      docs.forEach((d) =>
        new Set(d).forEach((t) => df.set(t, (df.get(t) || 0) + 1)),
      );
      const idf = (t) => Math.log((1 + N) / (1 + (df.get(t) || 0))) + 1;

      function vectorize(tokens) {
        const tf = new Map();
        tokens.forEach((t) => tf.set(t, (tf.get(t) || 0) + 1));
        const v = new Map();
        let sq = 0;
        tf.forEach((count, t) => {
          if (!df.has(t)) return;
          const w = count * idf(t);
          v.set(t, w);
          sq += w * w;
        });
        return { v, norm: Math.sqrt(sq) };
      }

      function cosine(a, b) {
        if (!a.norm || !b.norm) return 0;
        let dot = 0;
        a.v.forEach((w, t) => {
          if (b.v.has(t)) dot += w * b.v.get(t);
        });
        return dot / (a.norm * b.norm);
      }

      const docVecs = docs.map(vectorize);
      const THRESHOLD = 0.12;

      function findBest(userText) {
        const tokens = preprocess(userText);
        const qv = vectorize(tokens);
        let best = -1,
          bestScore = 0;
        docVecs.forEach((dv, i) => {
          const s = cosine(qv, dv);
          if (s > bestScore) {
            bestScore = s;
            best = i;
          }
        });
        return { tokens, best, score: bestScore };
      }

      /* ============================================================
   4. INTENTS + SAFETY CHECKS
   ============================================================ */
      const WORDS = {
        greeting: [
          "hello",
          "hi",
          "hey",
          "namaste",
          "good",
          "morning",
          "afternoon",
          "evening",
          "there",
          "नमस्ते",
          "नमस्कार",
        ],
        goodbye: [
          "bye",
          "goodbye",
          "exit",
          "quit",
          "stop",
          "see",
          "you",
          "later",
          "good",
          "अलविदा",
          "बाय",
        ],
        thanks: [
          "thanks",
          "thank",
          "you",
          "so",
          "much",
          "a",
          "lot",
          "धन्यवाद",
          "शुक्रिया",
        ],
        help: [
          "help",
          "topics",
          "what",
          "can",
          "you",
          "do",
          "me",
          "know",
          "मदद",
          "सहायता",
          "बताइए",
        ],
      };
      const allIn = (words, list) =>
        words.length > 0 && words.every((w) => list.includes(w));

      function detectIntent(text) {
        const w = preprocess(text);
        if (allIn(w, WORDS.greeting)) return "greeting";
        if (allIn(w, WORDS.goodbye)) return "goodbye";
        if (allIn(w, WORDS.thanks)) return "thanks";
        if (allIn(w, WORDS.help)) return "help";
        return "ask_question";
      }

      const EMERGENCY =
        /not breathing|stopped breathing|isn.?t breathing|can.?t breathe|cannot breathe|unconscious|unresponsive|chest pain|heart attack|stroke|severe bleeding|heavy bleeding|bleeding heavily|won.?t stop bleeding|choking|poison|overdose|snake|seizure|anaphyla|electric shock|electrocut|drown|साँस नहीं|सांस नहीं|बेहोश|सीने में दर्द|दिल का दौरा|स्ट्रोक|खून नहीं रुक|बहुत खून|दम घुट|ज़हर|जहर|ओवरडोज़|साँप ने काट|सांप ने काट|दौरा|बिजली का झटका|डूब/;
      const SELFHARM =
        /suicid|kill myself|end my life|want to die|self.?harm|आत्महत्या|खुदकुशी|मरना चाहता|मरना चाहती|जीना नहीं चाहता|जीना नहीं चाहती/;

      /* ============================================================
   5. TEXT-TO-SPEECH
   ============================================================ */
      const speakToggle = document.getElementById("speakToggle");
      function speak(text) {
        if (!speakToggle.checked || !("speechSynthesis" in window)) return;
        speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = language === "hi" ? "hi-IN" : "en-IN";
        speechSynthesis.speak(utterance);
      }

      /* ============================================================
   6. CHAT UI
   ============================================================ */
      const chat = document.getElementById("chat");
      const statusEl = document.getElementById("status");
      const input = document.getElementById("text");
      const languageSelect = document.getElementById("language");
      const esc = (s) =>
        s.replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );

      function el(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text) e.textContent = text;
        return e;
      }

      function addUser(text) {
        chat.appendChild(el("div", "msg user", text));
        chat.scrollTop = chat.scrollHeight;
      }

      function addBot(d) {
        const box = el("div", d.welcome ? "msg bot welcome-msg" : "msg bot");
        if (d.alert) box.appendChild(el("div", "alert", d.alert));
        if (d.title) box.appendChild(el("h2", "", d.title));
        if (d.intro) box.appendChild(el("p", "", d.intro));
        if (d.steps) {
          const ol = el("ol");
          d.steps.forEach((s) => ol.appendChild(el("li", "", s)));
          box.appendChild(ol);
        }
        if (d.warn) box.appendChild(el("div", "warn", d.warn));
        if (d.trace) {
          const t = el("div", "trace");
          t.innerHTML = d.trace; // built only from our own escaped strings
          box.appendChild(t);
        }
        chat.appendChild(box);
        chat.scrollTop = chat.scrollHeight;

        const spoken = [d.alert, d.title, d.intro]
          .concat(
            (d.steps || []).map(
              (s, i) => copy().step + " " + (i + 1) + ". " + s,
            ),
          )
          .concat([d.warn])
          .filter(Boolean)
          .join(" ");
        speak(spoken);
      }

      function reply(text) {
        const low = text.toLowerCase();
        const intent = detectIntent(text);

        if (SELFHARM.test(low)) {
          addBot({
            alert: copy().selfHarmTitle,
            intro: copy().selfHarm,
          });
          return;
        }
        if (intent === "greeting")
          return addBot({ intro: copy().greeting });
        if (intent === "thanks")
          return addBot({ intro: copy().thanks });
        if (intent === "goodbye") {
          if (listening && rec) rec.stop();
          return addBot({ intro: copy().goodbye });
        }
        if (intent === "help") {
          return addBot({
            intro:
              copy().help +
              KB.map((k) =>
                (language === "hi" ? HI_KB[k.title] : k).title.toLowerCase(),
              ).join(", ") +
              ".",
          });
        }

        const r = findBest(text);
        const pct = Math.round(Math.min(r.score, 1) * 100);
        const trace =
          "<b>" +
          copy().cleanedWords +
          "</b> " +
          (r.tokens.length ? esc(r.tokens.join(", ")) : copy().fallback) +
          "<br><b>" +
          copy().bestMatch +
          "</b> " +
          (r.best >= 0
            ? esc(
                (language === "hi" ? HI_KB[KB[r.best].title] : KB[r.best])
                  .title,
              )
            : copy().fallback) +
          "<br><b>" +
          copy().similarity +
          '</b><span class="bar"><i style="width:' +
          pct +
          '%"></i></span>' +
          r.score.toFixed(2);

        const alert = EMERGENCY.test(low) ? copy().emergency : null;

        if (r.score < THRESHOLD) {
          addBot({
            alert,
            intro: copy().noMatch,
            trace,
          });
        } else {
          const k = KB[r.best];
          const answer = language === "hi" ? HI_KB[k.title] : k;
          addBot({
            alert,
            title: answer.title,
            steps: answer.steps,
            warn: answer.warn,
            trace,
          });
        }
      }

      function handle(text) {
        text = text.trim();
        if (!text) return;
        addUser(text);
        reply(text);
      }

      document.getElementById("form").addEventListener("submit", (e) => {
        e.preventDefault();
        handle(input.value);
        input.value = "";
      });

      function renderChips() {
        const chips = document.getElementById("chips");
        chips.replaceChildren();
        copy().chips.forEach((q) => {
          const b = el("button", "", q);
          b.type = "button";
          b.onclick = () => handle(q);
          chips.appendChild(b);
        });
      }

      function applyLanguage() {
        const c = copy();
        document.documentElement.lang = language;
        document.title = c.title;
        document.getElementById("sos").textContent = c.sos;
        document.getElementById("languageLabel").textContent = c.language;
        languageSelect.setAttribute("aria-label", c.language);
        document.getElementById("heading").textContent = c.heading;
        document.getElementById("subtitle").textContent = c.subtitle;
        mic.setAttribute("aria-label", c.mic);
        mic.title = c.micTitle;
        input.placeholder = c.placeholder;
        input.setAttribute("aria-label", c.describe);
        document.getElementById("send").textContent = c.ask;
        document.getElementById("speakLabel").textContent = c.speak;
        document.getElementById("note").textContent = c.note;
        if (rec) rec.lang = language === "hi" ? "hi-IN" : "en-IN";
        statusEl.textContent = rec
          ? listening
            ? c.listening
            : ""
          : c.browserVoice;
        const welcome = chat.querySelector(".welcome-msg p");
        if (welcome) welcome.textContent = c.welcome;
        renderChips();
      }

      /* ============================================================
   7. SPEECH-TO-TEXT (Web Speech API: Chrome / Edge)
   ============================================================ */
      const mic = document.getElementById("mic");
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      let rec = null,
        listening = false;

      if (SR) {
        rec = new SR();
        rec.lang = language === "hi" ? "hi-IN" : "en-IN";
        rec.interimResults = true;
        rec.continuous = false;

        rec.onstart = () => {
          listening = true;
          mic.classList.add("on");
          statusEl.textContent = copy().listening;
        };
        rec.onend = () => {
          listening = false;
          mic.classList.remove("on");
          if (statusEl.textContent === copy().listening)
            statusEl.textContent = "";
        };
        rec.onerror = (e) => {
          statusEl.textContent =
            {
              "not-allowed": copy().micBlocked,
              "service-not-allowed": copy().micBlocked,
              "no-speech": copy().noSpeech,
              "audio-capture": copy().noMicrophone,
              network: copy().speechNetwork,
            }[e.error] || copy().micError + e.error;
        };
        rec.onresult = (e) => {
          let t = "";
          for (let i = 0; i < e.results.length; i++)
            t += e.results[i][0].transcript;
          input.value = t;
          if (e.results[e.results.length - 1].isFinal) {
            handle(t);
            input.value = "";
          }
        };
      } else {
        mic.disabled = true;
        statusEl.textContent = copy().browserVoice;
      }

      languageSelect.addEventListener("change", () => {
        language = languageSelect.value;
        applyLanguage();
      });

      mic.addEventListener("click", () => {
        if (!rec) return;
        speechSynthesis.cancel();
        try {
          listening ? rec.stop() : rec.start();
        } catch (err) {
          statusEl.textContent = copy().micStartError;
        }
      });

      applyLanguage();
      addBot({ intro: copy().welcome, welcome: true });
    </script>
  </body>
</html>
